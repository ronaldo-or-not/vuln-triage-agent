name: pr-triage

# 의존성 파일이 바뀐 PR에 트리아지 보고서를 댓글로 단다 (src/vulnagent/pr_comment.py).
# - pull_request만 쓴다. pull_request_target은 포크의 코드를 비밀값과 함께 돌리게 되므로 쓰지 않는다.
#   포크 PR에는 비밀값이 전달되지 않아 ANTHROPIC_API_KEY 없이 조용히 끝난다.
# - 정보 제공용: 취약점이 있어도 이 검사는 실패하지 않는다.
# - 평가 케이스(eval/)와 테스트 픽스처(tests/)는 실제 의존성 파일이 아니므로 뺀다.
on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - "**/package-lock.json"
      - "**/package.json"
      - "**/pom.xml"
      - "**/build.gradle"
      - "!eval/**"
      - "!tests/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16  # CWE 카탈로그(security-kb) 스키마에 pgvector 확장이 필요하다
        env:
          POSTGRES_USER: vt
          POSTGRES_PASSWORD: vt
          POSTGRES_DB: vulnagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vt:vt@localhost:5432/vulnagent
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::ANTHROPIC_API_KEY is not available (fork PR or secret not set); skipping triage."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # base 버전의 파일과 merge-base가 필요하다
      - uses: actions/setup-python@v5
        if: steps.key.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.key.outputs.enabled == 'true'
        run: pip install -e .
      - name: Prepare data (schema, KEV/EPSS snapshots)
        if: steps.key.outputs.enabled == 'true'
        run: |
          python -m vulnagent init-db
          python -m vulnagent sync
      - name: Load CWE catalog (names and mitigations; triage still runs without it)
        if: steps.key.outputs.enabled == 'true'
        continue-on-error: true
        run: python -m vulnagent.kb.cwe
      - name: Triage changed dependency files and comment
        if: steps.key.outputs.enabled == 'true'
        run: python -m vulnagent.pr_comment
